name: One-time DM encounter handoff import
on:
  push:
    branches:
      - transfer/v23-dm-encounter-handoff
    paths:
      - .github/workflows/dm-encounter-handoff-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Validate and import DM handoff changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 02ff34f770cfbfd887b05a85fdab0f60a439c6a7)" = "02ff34f770cfbfd887b05a85fdab0f60a439c6a7"
          base64 --decode .handoff-transfer/part-00.txt | gzip --decompress > /tmp/fk-handoff.patch
          git apply --check /tmp/fk-handoff.patch
          git apply /tmp/fk-handoff.patch
          rm -rf .handoff-transfer .github/workflows/dm-encounter-handoff-import.yml
          git add -A
          test "$(git write-tree)" = "86736ee120913099357f2232fad03a89ae9d5471"
          git config user.name "Four Keeps release automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import tested DM template encounter handoff"
          git push origin HEAD:refs/heads/transfer/v23-dm-encounter-handoff
