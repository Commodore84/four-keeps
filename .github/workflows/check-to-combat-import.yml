name: One-time check-to-combat import
on:
  push:
    branches:
      - transfer/v23-check-to-encounter-20261124
    paths:
      - .github/workflows/check-to-combat-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify baseline and import tested transition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD ecf6bf248ee660b5a74d1a2abdd22558316529ba)" = "ecf6bf248ee660b5a74d1a2abdd22558316529ba"
          base64 --decode .encounter-check-transfer/part-00.txt | gzip --decompress > /tmp/check-to-combat.patch
          git apply --check /tmp/check-to-combat.patch
          git apply /tmp/check-to-combat.patch
          rm -rf .encounter-check-transfer .github/workflows/check-to-combat-import.yml
          git add -A
          test "$(git write-tree)" = "f348c077ce408ce9d04d9c46dae4ceadfe5dea05"
          git config user.name "Four Keeps release automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import tested skill-check to tactical encounter transition"
          git push origin HEAD:refs/heads/transfer/v23-check-to-encounter-20261124
