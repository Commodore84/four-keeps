name: One-time solo tier candidate import
on:
  push:
    branches:
      - transfer/v23-three-difficulty-tiers
    paths:
      - .github/workflows/three-tier-import.yml
permissions:
  contents: write
jobs:
  import-tiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify exact source tree and import revised three tiers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 58f11c834bfbdde3ceb8e1b7338546d0a3c8deaf)" = "58f11c834bfbdde3ceb8e1b7338546d0a3c8deaf"
          cat .tier-transfer/part-00.txt | base64 --decode | gzip --decompress > /tmp/three-tiers.patch
          git apply --check /tmp/three-tiers.patch
          git apply /tmp/three-tiers.patch
          rm -rf .tier-transfer .github/workflows/three-tier-import.yml
          git add -A
          test "$(git write-tree)" = "4b3dc41b2f0590c9670fc9d242becda1efc4c8c1"
          git config user.name "Four Keeps release automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import revised 50, 75 and 100 XP encounters with merchant clues"
          git push origin HEAD:refs/heads/transfer/v23-three-difficulty-tiers
