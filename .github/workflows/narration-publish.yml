name: Publish verified narration formatting
on:
  push:
    branches: [opening-polish-publish-staging]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact source and publish
        run: python3 .fmt-transfer/publish.py
