<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171d1b"><title>Four Keeps — Character Creator</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#111715;color:#f2eee2}main{max-width:650px;margin:auto;padding:20px 18px 110px}header{padding:12px 0 20px;border-bottom:1px solid #4c594e}h1{font-family:Georgia,serif;font-size:30px;margin:5px 0}h2{font-family:Georgia,serif;font-size:25px;margin:12px 0}p{color:#c4cabb;line-height:1.55}.muted{font-size:13px;color:#9fac9d}.eyebrow{font-size:11px;letter-spacing:.17em;color:#d7bb79;text-transform:uppercase}.progress{display:flex;gap:5px;margin:18px 0}.progress span{height:5px;flex:1;border-radius:8px;background:#38453d}.progress span.active{background:#d8ba7d}.option{display:block;width:100%;text-align:left;border:1px solid #45534a;background:#1d2823;color:#f2eee2;border-radius:12px;padding:13px;margin:9px 0;font-size:16px}.option.selected{border-color:#dfbd79;background:#35402f}.option small{display:block;color:#b3c0b4;margin-top:5px;line-height:1.4}.field{width:100%;border:1px solid #536155;background:#1d2823;border-radius:10px;color:white;padding:13px;font-size:16px;margin:8px 0 15px}label{font-size:14px;color:#e5e6d9}.bar{position:fixed;bottom:0;left:0;right:0;background:#17201c;border-top:1px solid #435044;padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}.bar button{padding:14px 18px;border-radius:10px;border:1px solid #657266;background:#28372e;color:#fff;font-weight:650;max-width:300px;flex:1}.bar button.primary{background:#d7b778;color:#1a201b;border-color:#d7b778}.bar button:disabled{opacity:.4}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#1e2923;border:1px solid #435044;border-radius:12px;padding:10px}.stat select{width:100%;margin-top:8px;padding:9px;background:#111715;color:#fff;border-radius:8px;border:1px solid #5a685b}.sheet{background:#1d2823;border:1px solid #526051;border-radius:14px;padding:17px;margin-top:12px}.sheet p{margin:6px 0}.warning{border-left:3px solid #d7b778;padding:10px 12px;background:#2b2c24;font-size:13px;color:#e5d8b7;margin-top:14px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #e7c783}
textarea{min-height:90px;resize:vertical}.smallbutton{padding:10px 13px;background:#35402f;color:#fff;border:1px solid #647466;border-radius:9px;font-size:14px;margin:5px 6px 10px 0}.hint{padding:12px;border:1px solid #536155;border-radius:10px;color:#d5d7c8;margin:12px 0;line-height:1.5}.field:focus{outline:2px solid #d7b778}.sheet strong{color:#e4c78c}</style></head><body><main><header><div class="eyebrow">Four Keeps · Character Creator 0.3</div><h1>Four Keeps</h1><div class="muted">Create a hero. Claim a keep. Shape a world.</div></header><div class="progress" id="progress"></div><div id="screen"></div></main><nav class="bar"><button id="back" type="button">Back</button><button id="next" class="primary" type="button">Continue</button></nav><script>"use strict";
const classes=['Barbarian','Bard','Cleric','Druid','Fighter','Monk','Paladin','Ranger','Rogue','Sorcerer','Warlock','Wizard'];
const backgrounds=['Acolyte','Artisan','Charlatan','Criminal','Entertainer','Farmer','Guard','Guide','Hermit','Merchant','Noble','Sage','Sailor','Scribe','Soldier','Wayfarer'];
const species=['Aasimar','Dragonborn','Dwarf','Elf','Gnome','Goliath','Halfling','Human','Orc','Tiefling'];

const classGuide={"Barbarian":{"description":"Rage-fueled frontline warrior","paths":[["Berserker","ferocious offense"],["Wild Heart","animal-inspired versatility"],["World Tree","protection and mobility"],["Zealot","divine fury"]]},"Bard":{"description":"Versatile support spellcaster and skill expert","paths":[["Dance","movement and inspiration"],["Glamour","charm and enchantment"],["Lore","knowledge and spell versatility"],["Valor","martial leadership"]]},"Cleric":{"description":"Divine spellcaster who heals, protects, or attacks","paths":[["Life","healing"],["Light","radiant magic"],["Trickery","misdirection"],["War","martial devotion"]]},"Druid":{"description":"Nature magic, wild shape, and primal powers","paths":[["Land","terrain-inspired spells"],["Moon","wild shape"],["Sea","storm and sea magic"],["Stars","celestial guidance"]]},"Fighter":{"description":"Flexible weapon and armor specialist","paths":[["Battle Master","tactical maneuvers"],["Champion","athletic prowess"],["Eldritch Knight","arcane weapons"],["Psi Warrior","psychic powers"]]},"Monk":{"description":"Mobile unarmed martial artist using Focus","paths":[["Mercy","healing and harm"],["Shadow","stealth"],["Elements","elemental strikes"],["Open Hand","unarmed control"]]},"Paladin":{"description":"Armored divine champion with protective magic","paths":[["Devotion","honor"],["Glory","heroic feats"],["Ancients","nature and hope"],["Vengeance","pursuit"]]},"Ranger":{"description":"Wilderness explorer combining weapons and nature magic","paths":[["Beast Master","animal companion"],["Fey Wanderer","fey magic"],["Gloom Stalker","ambush"],["Hunter","combat specialization"]]},"Rogue":{"description":"Stealthy precision striker and resourceful skill expert","paths":[["Arcane Trickster","illusion magic"],["Assassin","ambush"],["Soulknife","psychic blades"],["Thief","agility and items"]]},"Sorcerer":{"description":"Innate spellcaster who modifies magic with Metamagic","paths":[["Aberrant Sorcery","psychic powers"],["Clockwork Sorcery","order"],["Draconic Sorcery","dragon magic"],["Wild Magic","unpredictable surges"]]},"Warlock":{"description":"Pact spellcaster with customizable invocations","paths":[["Archfey","fey tricks"],["Celestial","radiance and healing"],["Fiend","infernal power"],["Great Old One","alien psychic magic"]]},"Wizard":{"description":"Studious spellcaster with a broad spellbook","paths":[["Abjurer","defense"],["Diviner","foresight"],["Evoker","destructive magic"],["Illusionist","deception"]]}};
const backgroundGuide={"Acolyte":{"description":"Religious servant; faith and community","benefits":"Insight, Religion; Calligrapher's Supplies; Magic Initiate (Cleric)"},"Artisan":{"description":"Guild-trained maker and craftsperson","benefits":"Investigation, Persuasion; Artisan's Tools; Crafter"},"Charlatan":{"description":"Impostor skilled at false identities","benefits":"Deception, Sleight of Hand; Forgery Kit; Skilled"},"Criminal":{"description":"Underworld survivor with illicit contacts","benefits":"Sleight of Hand, Stealth; Thieves' Tools; Alert"},"Entertainer":{"description":"Performer who captivates crowds","benefits":"Acrobatics, Performance; Musical Instrument; Musician"},"Farmer":{"description":"Rural worker hardened by daily labor","benefits":"Animal Handling, Nature; Carpenter's Tools; Tough"},"Guard":{"description":"Watchkeeper trained to spot threats","benefits":"Athletics, Perception; Gaming Set; Alert"},"Guide":{"description":"Wilderness pathfinder and navigator","benefits":"Stealth, Survival; Cartographer's Tools; Magic Initiate (Druid)"},"Hermit":{"description":"Solitary seeker of unusual insights","benefits":"Medicine, Religion; Herbalism Kit; Healer"},"Merchant":{"description":"Trader accustomed to bargaining","benefits":"Animal Handling, Persuasion; Navigator's Tools; Lucky"},"Noble":{"description":"Privileged courtier with obligations","benefits":"History, Persuasion; Gaming Set; Skilled"},"Sage":{"description":"Scholar of lore and arcane knowledge","benefits":"Arcana, History; Calligrapher's Supplies; Magic Initiate (Wizard)"},"Sailor":{"description":"Seasoned seafarer and port traveler","benefits":"Acrobatics, Perception; Navigator's Tools; Tavern Brawler"},"Scribe":{"description":"Writer and keeper of records","benefits":"Investigation, Perception; Calligrapher's Supplies; Skilled"},"Soldier":{"description":"Disciplined military veteran","benefits":"Athletics, Intimidation; Gaming Set; Savage Attacker"},"Wayfarer":{"description":"Streetwise traveler and survivor","benefits":"Insight, Stealth; Thieves' Tools; Lucky"}};
const speciesGuide={"Aasimar":{"description":"Celestial heritage; healing, radiant resistance, and later revelation","variants":[]},"Dragonborn":{"description":"Breath weapon and resistance determined by dragon ancestry","variants":[["Black","acid"],["Blue","lightning"],["Brass","fire"],["Bronze","lightning"],["Copper","acid"],["Gold","fire"],["Green","poison"],["Red","fire"],["Silver","cold"],["White","cold"]]},"Dwarf":{"description":"Darkvision, resilience, toughness, and stone awareness","variants":[]},"Elf":{"description":"Darkvision, keen senses, trance, and lineage magic","variants":[["Drow","darkness magic"],["High Elf","arcane magic"],["Wood Elf","speed and nature magic"]]},"Gnome":{"description":"Small and magically resilient, with lineage-specific talents","variants":[["Forest Gnome","minor nature magic"],["Rock Gnome","magical tinkering"]]},"Goliath":{"description":"Giant ancestry and powerful physical gifts","variants":[["Cloud","teleportation"],["Fire","fire damage"],["Frost","slowing cold"],["Hill","knockdown"],["Stone","damage reduction"],["Storm","thunder retaliation"]]},"Halfling":{"description":"Lucky, brave, and able to move through larger crowds","variants":[]},"Human":{"description":"Versatile: an additional Origin feat and skill proficiency","variants":[]},"Orc":{"description":"Darkvision, Adrenaline Rush, and powerful survival instincts","variants":[]},"Tiefling":{"description":"Fiendish legacy granting resistance and developing magic","variants":[["Abyssal","poison"],["Chthonic","necrotic"],["Infernal","fire"]]}};
function guidedScreen(kind){
const guide=kind==='class'?classGuide:kind==='background'?backgroundGuide:speciesGuide;
const title=kind==='class'?'Choose your class':kind==='background'?'Choose your background':'Choose your species';
const intro=kind==='class'?'Choose how you want to adventure. Subclasses normally become available at level 3; these are previews, not a commitment.':kind==='background'?'Backgrounds provide ability-score increases, two skill proficiencies, a tool proficiency, and an Origin feat. The listed benefits are previews; calculations come later.':'Species grants traits such as senses, movement, resistances, or innate magic. In the 2024 rules, ability-score increases come from background, not species.';
let html='<div class="eyebrow">Step '+(step+1)+' of 9</div><h2>'+title+'</h2><p>'+intro+'</p>';
Object.entries(guide).forEach(([name,data])=>{
const selected=state[kind]===name;
html+='<button type="button" class="option '+(selected?'selected':'')+'" data-guided="'+escapeHTML(name)+'"><strong>'+escapeHTML(name)+'</strong><small>'+escapeHTML(data.description)+'</small></button>';
if(selected){
html+='<div class="sheet">';
if(kind==='class'){html+='<strong>Subclass paths (level 3)</strong><p class="muted">Preview only. You will choose your subclass later.</p>'+data.paths.map(([n,d])=>'<p><strong>'+escapeHTML(n)+'</strong> — '+escapeHTML(d)+'</p>').join('')}
if(kind==='background'){html+='<strong>2024 background benefits</strong><p>'+escapeHTML(data.benefits)+'</p><p class="muted">Ability-score options and equipment will be added when we update ability scores.</p>'}
if(kind==='species'){html+='<strong>Species traits</strong><p>'+escapeHTML(data.description)+'</p>';if(data.variants.length){html+='<p>Choose your heritage:</p>'+data.variants.map(([n,d])=>'<button type="button" class="option '+(state.speciesVariant===n?'selected':'')+'" data-heritage="'+escapeHTML(n)+'"><strong>'+escapeHTML(n)+'</strong><small>'+escapeHTML(d)+'</small></button>').join('')}}
html+='</div>'
}
});
if(kind==='background'){
html+='<button type="button" class="option '+(state.background==='Custom'?'selected':'')+'" data-guided="Custom"><strong>Custom background</strong><small>Tell your own story and propose starting proficiencies and an Origin feat.</small></button>';
if(state.background==='Custom'){
html+='<div class="sheet"><strong>Build a custom background</strong><p>Custom backgrounds require DM approval under the 2024 rules. Proposed mechanics are saved but not yet validated or applied.</p>';
[['customBackgroundName','Background name'],['customBackgroundStory','Background story'],['customBackgroundSkills','Two skill proficiencies'],['customBackgroundTool','Tool proficiency'],['customBackgroundFeat','Origin feat']].forEach(([id,label])=>{html+='<label for="'+id+'">'+label+'</label><input class="field" id="'+id+'" maxlength="300" placeholder="'+label+'">'});
html+='</div>';
}
}
screen.innerHTML=html;
screen.querySelectorAll('[data-guided]').forEach(b=>b.onclick=()=>{const value=b.dataset.guided;if(kind==='species'&&value!==state.species)state.speciesVariant='';state[kind]=value;save();render()});
screen.querySelectorAll('[data-heritage]').forEach(b=>b.onclick=()=>{state.speciesVariant=b.dataset.heritage;save();render()});
if(kind==='background'&&state.background==='Custom'){['customBackgroundName','customBackgroundStory','customBackgroundSkills','customBackgroundTool','customBackgroundFeat'].forEach(id=>{const e=document.getElementById(id);e.value=state[id]||'';e.oninput=()=>{state[id]=e.value;save()}})}
}
const regions=[['Mountains','High peaks, mines, and ancient passes'],['Greenlands','Rivers, settlements, and fertile countryside'],['Forest','Deep woods, hidden ruins, and wild places'],['Coast','Harbors, islands, and stormy shores']];
const origins=[['Inherited','Someone left you a stronghold and perhaps their unfinished business'],['Awarded','A patron or authority granted you the property'],['Purchased','You bought it, though its history may be complicated'],['Claimed','You occupied a neglected or abandoned site'],['Won','You gained it through a contest, wager, or bargain'],['Stolen','You acquired the deed or property by questionable means'],['Discovered','You uncovered a forgotten claim or lost stronghold'],['Entrusted','Someone placed it in your care']];
const abilities=['STR','DEX','CON','INT','WIS','CHA'], array=[15,14,13,12,10,8];
const fresh=()=>({name:'',class:'',background:'',species:'',speciesVariant:'',customBackgroundName:'',customBackgroundStory:'',customBackgroundSkills:'',customBackgroundTool:'',customBackgroundFeat:'',scores:[15,14,13,12,10,8],region:'',origin:'',bastionName:'',originDetail:'',notes:''});
let state=fresh(),step=0;
try{const stored=JSON.parse(localStorage.getItem('fourKeepsCharacterV02'));if(stored&&typeof stored==='object')state={...fresh(),...stored}}catch(e){}
const screen=document.getElementById('screen'), next=document.getElementById('next'),back=document.getElementById('back');
const save=()=>{try{localStorage.setItem('fourKeepsCharacterV02',JSON.stringify(state))}catch(e){}};
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mod=n=>Math.floor((n-10)/2);
function pick(key,value){state[key]=value;save();render()}
function optionScreen(title,desc,key,items){screen.innerHTML=`<div class="eyebrow">Step ${step+1} of 9</div><h2>${title}</h2><p>${desc}</p>`+items.map(([value,desc])=>`<button type="button" class="option ${state[key]===value?'selected':''}" data-choice="${escapeHTML(value)}"><strong>${escapeHTML(value)}</strong>${desc?`<small>${escapeHTML(desc)}</small>`:''}</button>`).join('');screen.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>pick(key,b.dataset.choice)))}
function render(){document.getElementById('progress').innerHTML=Array.from({length:9},(_,i)=>`<span class="${i<=step?'active':''}"></span>`).join('');back.disabled=step===0;let valid=true;
if(step===0){screen.innerHTML='<div class="eyebrow">Step 1 of 9</div><h2>Name your hero</h2><p>Your adventurer’s name can be changed later.</p><label for="hero">Character name</label><input class="field" id="hero" maxlength="60" placeholder="Character name" autocomplete="off"><div class="hint">This is a working early prototype, not yet a complete D&D 2024 rules-validated character sheet.</div>';const el=document.getElementById('hero');el.value=state.name;el.oninput=()=>{state.name=el.value;save();next.disabled=!state.name.trim()};valid=!!state.name.trim()}
if(step===1){guidedScreen('class');valid=!!state.class}
if(step===2){guidedScreen('background');valid=!!state.background}
if(step===3){guidedScreen('species');valid=!!state.species&&(!speciesGuide[state.species].variants.length||speciesGuide[state.species].variants.some(v=>v[0]===state.speciesVariant))}
if(step===4){screen.innerHTML='<div class="eyebrow">Step 5 of 9</div><h2>Ability scores</h2><p>Assign each standard-array score once. Background increases are not yet applied.</p><div class="stats">'+abilities.map((a,i)=>`<div class="stat"><label for="stat${i}">${a}</label><select id="stat${i}">${array.map(n=>`<option value="${n}" ${state.scores[i]===n?'selected':''}>${n} (${mod(n)>=0?'+':''}${mod(n)})</option>`).join('')}</select></div>`).join('')+'</div><div class="hint" id="statMessage"></div>';abilities.forEach((a,i)=>{document.getElementById('stat'+i).onchange=e=>{state.scores[i]=Number(e.target.value);save();render()}});valid=Array.isArray(state.scores)&&state.scores.length===6&&new Set(state.scores).size===6;document.getElementById('statMessage').textContent=valid?'Valid standard array.':'Use each score exactly once.'}
if(step===5){optionScreen('Choose your starting region','Working labels only. The final geographical names can be decided later. No automatic regional skill bonuses.','region',regions);valid=!!state.region}
if(step===6){optionScreen('How did you acquire your Bastion?','Choose any origin regardless of your background, or roll a d8. The result is never mandatory.','origin',origins);const roll=document.createElement('button');roll.className='smallbutton';roll.textContent='Roll d8 for a random origin';roll.onclick=()=>pick('origin',origins[Math.floor(Math.random()*8)][0]);screen.insertBefore(roll,screen.querySelector('[data-choice]'));valid=!!state.origin}
if(step===7){screen.innerHTML='<div class="eyebrow">Step 8 of 9</div><h2>Name your Bastion</h2><p>This is your stronghold. Its name is independent of your region and background.</p><label for="bastion">Bastion name</label><input id="bastion" class="field" maxlength="70" placeholder="e.g. Blackthorn Keep" autocomplete="off"><label for="details">How did you acquire it? (optional)</label><textarea id="details" class="field" placeholder="A stolen deed, an unexpected inheritance, a mysterious benefactor..."></textarea><label for="notes">Character backstory notes (optional)</label><textarea id="notes" class="field" placeholder="People, places, obligations, ambitions..."></textarea>';const b=document.getElementById('bastion'),d=document.getElementById('details'),n=document.getElementById('notes');b.value=state.bastionName;d.value=state.originDetail;n.value=state.notes;b.oninput=()=>{state.bastionName=b.value;save();next.disabled=!b.value.trim()};d.oninput=()=>{state.originDetail=d.value;save()};n.oninput=()=>{state.notes=n.value;save()};valid=!!state.bastionName.trim()}
if(step===8){screen.innerHTML='<div class="eyebrow">Step 9 of 9</div><h2>Character summary</h2><div class="sheet"><h2 id="displayName"></h2><p id="identity"></p><p id="region"></p><p id="bastion"></p><p id="origin"></p><p id="detail"></p><p id="story"></p><hr style="border-color:#45534a"><div class="stats">'+abilities.map((a,i)=>`<div class="stat"><strong>${a}</strong><p>${state.scores[i]} (${mod(state.scores[i])>=0?'+':''}${mod(state.scores[i])})</p></div>`).join('')+'</div></div><div class="hint">Saved locally in this browser. Not yet calculated: background ability boosts, skill/tool proficiencies, Origin feat, class features, species traits, equipment, spells, HP, and other 2024 rules.</div><button class="option" id="export">Export character as JSON</button><button class="option" id="reset">Start a new character</button>';const set=(id,t)=>document.getElementById(id).textContent=t;set('displayName',state.name);set('identity',`Level 1 ${state.species}${state.speciesVariant?' ('+state.speciesVariant+')':''} ${state.class} · ${state.background==='Custom'?(state.customBackgroundName||'Custom'):state.background}`);set('region',`Starting region: ${state.region}`);set('bastion',`Bastion: ${state.bastionName}`);set('origin',`Origin: ${state.origin}`);set('detail',state.originDetail);set('story',state.notes);document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({schemaVersion:'0.3',character:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='four-keeps-character.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)};document.getElementById('reset').onclick=()=>{if(confirm('Start over and replace this saved character?')){state=fresh();step=0;save();render()}}}
next.disabled=!valid;next.textContent=step===8?'Saved on this device':'Continue';}
next.onclick=()=>{if(step<8&&!next.disabled){step++;render();window.scrollTo(0,0)}};
back.onclick=()=>{if(step>0){step--;render();window.scrollTo(0,0)}};
render();
</script></body></html>
